name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Build & Deploy on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "🚀 Connecting to EC2 and pulling latest changes..."
            
            # Navigate to project folder
            cd /home/ubuntu/sandesh

            # Discard any local tracking conflicts and pull latest from GitHub
            git reset --hard HEAD
            git pull

            # Rebuild and restart containers in background
            docker compose up --build -d

            # Clean up dangling images to keep EC2 disk healthy
            docker image prune -f

            echo "✅ Deployment finished successfully!"
            docker compose ps
