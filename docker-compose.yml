name: sandesh

services:
  # ── MongoDB Service ─────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: sandesh-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - sandesh-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Sandesh Backend (API + Self-Hosted SMTP Server) ─────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sandesh-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SMTP_PORT=2525
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/phonemail}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - MAIL_DOMAIN=${MAIL_DOMAIN:-sandesh.in}
      # ── Telnyx SMS / Voice / IVR Credentials ──
      - TELNYX_API_KEY=${TELNYX_API_KEY:-}
      - TELNYX_PHONE_NUMBER=${TELNYX_PHONE_NUMBER:-}
      - TELNYX_CONNECTION_ID=${TELNYX_CONNECTION_ID:-}
      - TELNYX_MESSAGING_PROFILE_ID=${TELNYX_MESSAGING_PROFILE_ID:-}
      # ── Webhook URL (for Telnyx callbacks) ──
      - PUBLIC_WEBHOOK_BASE_URL=${PUBLIC_WEBHOOK_BASE_URL:-}
      # ── Groq AI (FAQ Chatbot + Spam Detection + Email Assist) ──
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      # ── Logging ──
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
      - "${SMTP_PORT:-2525}:2525"
    volumes:
      - uploads-data:/app/uploads
    networks:
      - sandesh-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Sandesh Frontend (Vite React + Nginx Reverse Proxy) ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sandesh-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - sandesh-network

# ── Persistent Storage Volumes ────────────────────────────────────────────────
volumes:
  mongo-data:
    driver: local
  uploads-data:
    driver: local

# ── Isolated Internal Bridge Network ──────────────────────────────────────────
networks:
  sandesh-network:
    driver: bridge
